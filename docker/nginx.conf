# Serve o build estático do front (React). O Nginx de borda da VPS faz HTTPS e encaminha
# agenda.orlwambier.com.br/ para cá e /api para a API.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Arquivos com hash no nome (JS/CSS/imagens do build): cache longo.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache, para o navegador sempre pegar a versão nova após um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do React (/SGA/agenda, /SGA/confirmacao...) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
